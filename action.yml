name: 'Docker Build, Push & Notify'
description: 'Builds a Docker image, pushes it to any registry, triggers a webhook, and sends a Telegram notification.'

inputs:
  registry:
    description: 'Docker registry URL (leave blank for Docker Hub, or use ghcr.io, registry.gitlab.com, etc.)'
    required: false
    default: 'ghcr.io'
  username:
    description: 'Registry username'
    required: true
  password:
    description: 'Registry password or token'
    required: true
  image_tag:
    description: 'Full image tag (e.g., ghcr.io/user/repo:latest)'
    required: true
  context:
    description: 'Docker build context'
    required: false
    default: '.'
  webhook_url:
    description: 'Deployment webhook URL'
    required: true
  telegram_token:
    description: 'Telegram bot token'
    required: true
  telegram_to:
    description: 'Telegram chat ID'
    required: true
  commit_message:
    description: 'Commit message for the notification'
    required: false
    default: 'Successful deployment update'

runs:
  using: "composite"
  steps:
    - name: Determine Image Tag
      id: get-tag
      shell: bash
      run: |
        if [ -z "${{ inputs.image_tag }}" ]; then
          if [ -z "${{ inputs.registry }}" ]; then
            AUTO_TAG="${{ github.repository }}:latest"
          else
            AUTO_TAG="${{ inputs.registry }}/${{ github.repository }}:latest"
          fi
          echo "tag=$AUTO_TAG" >> $GITHUB_OUTPUT
          echo "Using auto-generated tag: $AUTO_TAG"
        else
          echo "tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          echo "Using provided tag: ${{ inputs.image_tag }}"
        fi  
    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Build and publish
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        push: true
        tags: ${{ inputs.image_tag }}

    - name: Invoke deployment hook
      if: ${{ success() }}
      uses: distributhor/workflow-webhook@v3
      with:
        webhook_url: ${{ inputs.webhook_url }}

    - name: Send success notification
      if: ${{ success() }}
      uses: appleboy/telegram-action@v1
      with:
        to: ${{ inputs.telegram_to }}
        token: ${{ inputs.telegram_token }}
        message: Build success "${{ inputs.commit_message }}"

    - name: Send failure notification
      if: ${{ failure() }}
      uses: appleboy/telegram-action@v1
      with:
        to: ${{ inputs.telegram_to }}
        token: ${{ inputs.telegram_token }}
        message: Build failed "${{ inputs.commit_message }}"        