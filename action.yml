name: 'Docker Build, Push & Notify'
description: 'Builds a Docker image, pushes it to any registry, triggers a webhook, and sends a Telegram notification.'

inputs:
  registry:
    description: 'Docker registry URL (leave blank for Docker Hub, or use ghcr.io, registry.gitlab.com, etc.)'
    required: false
    default: 'ghcr.io'
  username:
    description: 'Registry username'
    required: true
  password:
    description: 'Registry password or token'
    required: true
  image_tag:
    description: 'Full image tag (e.g., ghcr.io/user/repo:latest)'
    required: false
    default: ''
  context:
    description: 'Docker build context'
    required: false
    default: '.'
  komodo_address:
    description: 'Komodo URL'
    required: true
  komodo_api_key:
    description: 'Komodo API Key'
    required: true
  komodo_api_secret:
    description: 'Komodo API Secret'
    required: true     
  stack_name:
    description: 'Komodo Stack Name'
    required: true     
  telegram_token:
    description: 'Telegram bot token'
    required: true
  telegram_to:
    description: 'Telegram chat ID'
    required: true
  commit_message:
    description: 'Commit message for the notification'
    required: false
    default: 'Successful deployment update'

runs:
  using: "composite"
  steps:
    - name: Determine Image Tag
      id: get-tag
      shell: bash
      run: |
        if [ -z "${{ inputs.image_tag }}" ]; then
          if [ -z "${{ inputs.registry }}" ]; then
            AUTO_TAG="${{ github.repository }}:latest"
          else
            AUTO_TAG="${{ inputs.registry }}/${{ github.repository }}:latest"
          fi
          echo "tag=$AUTO_TAG" >> $GITHUB_OUTPUT
          echo "Using auto-generated tag: $AUTO_TAG"
        else
          echo "tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          echo "Using provided tag: ${{ inputs.image_tag }}"
        fi  
    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Build and publish
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        push: true
        tags: ${{ steps.get-tag.outputs.tag }}

    - name: Force Komodo stack deploy
      if: ${{ success() }}
      shell: bash
      env:
        KOMODO_ADDRESS: ${{ inputs.komodo_address }}
        KOMODO_API_KEY: ${{ inputs.komodo_api_key }}
        KOMODO_API_SECRET: ${{ inputs.komodo_api_secret }}
        STACK_NAME: ${{ inputs.stack_name }}
      run: |
        HTTP_RESPONSE=$(curl -s -w '\n%{http_code}' \
          -X POST "$KOMODO_ADDRESS/execute/DeployStack" \
          -H "Content-Type: application/json" \
          -H "X-Api-Key: $KOMODO_API_KEY" \
          -H "X-Api-Secret: $KOMODO_API_SECRET" \
          -d "{\"stack\": \"$STACK_NAME\"}")

        HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
        HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1)

        echo "HTTP Status Code: $HTTP_STATUS"
        echo "Response Body:"
        echo "$HTTP_BODY"

        SUCCESS=$(echo "$HTTP_BODY" | jq -r '.success // empty')
        if [ "$SUCCESS" = "false" ]; then
          echo "Komodo deploy reported failure"
          exit 1
        fi

    - name: Send success notification
      if: ${{ success() }}
      uses: appleboy/telegram-action@v1
      with:
        to: ${{ inputs.telegram_to }}
        token: ${{ inputs.telegram_token }}
        message: Build success "${{ inputs.commit_message }}"

    - name: Send failure notification
      if: ${{ failure() }}
      uses: appleboy/telegram-action@v1
      with:
        to: ${{ inputs.telegram_to }}
        token: ${{ inputs.telegram_token }}
        message: Build failed "${{ inputs.commit_message }}"