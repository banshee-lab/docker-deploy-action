name: 'Docker Build, Push & Notify'
description: 'Builds a Docker image, pushes it to any registry, triggers a webhook, and sends a Telegram notification.'

inputs:
  registry:
    description: 'Docker registry URL (leave blank for Docker Hub, or use ghcr.io, registry.gitlab.com, etc.)'
    required: false
    default: 'ghcr.io'
  username:
    description: 'Registry username'
    required: true
  password:
    description: 'Registry password or token'
    required: true
  image_tag:
    description: 'Full image tag (e.g., ghcr.io/user/repo:latest)'
    required: false
    default: ''
  context:
    description: 'Docker build context'
    required: false
    default: '.'
  webhook_url:
    description: 'Deployment webhook URL'
    required: true
  webhook_secret:
    description: 'Deployment webhook Secret'
    required: true    
  telegram_token:
    description: 'Telegram bot token'
    required: true
  telegram_to:
    description: 'Telegram chat ID'
    required: true
  commit_message:
    description: 'Commit message for the notification'
    required: false
    default: 'Successful deployment update'

runs:
  using: "composite"
  steps:
    - name: Determine Image Tag
      id: get-tag
      shell: bash
      run: |
        if [ -z "${{ inputs.image_tag }}" ]; then
          if [ -z "${{ inputs.registry }}" ]; then
            AUTO_TAG="${{ github.repository }}:latest"
          else
            AUTO_TAG="${{ inputs.registry }}/${{ github.repository }}:latest"
          fi
          echo "tag=$AUTO_TAG" >> $GITHUB_OUTPUT
          echo "Using auto-generated tag: $AUTO_TAG"
        else
          echo "tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          echo "Using provided tag: ${{ inputs.image_tag }}"
        fi  
    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Build and publish
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        push: true
        tags: ${{ steps.get-tag.outputs.tag }}

    - name: Invoke deployment Webhook
      if: ${{ success() }}
      shell: bash
      run: |
        PAYLOG_REF="heads/${{ github.ref_name }}"
        if [ "${{ github.ref_type }}" = "tag" ]; then
          PAYLOG_REF="tags/${{ github.ref_name }}"
        fi

        PAYLOAD=$(cat <<EOF
        {
          "ref": "$PAYLOG_REF",
        }
        EOF
        )

        echo "------- PAYLOAD -------"
        echo "$PAYLOAD"
        echo "-----------------------"       

        DELIVERY_ID=$(uuidgen 2>/dev/null || cat /proc/sys/kernel/random/uuid 2>/dev/null || date +%s)
        SIGNATURE="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ inputs.webhook_secret }}" | sed 's/.*= //')"

        CURL_ARGS="-X POST \"${{ inputs.webhook_url }}\" \
          -H \"Content-Type: application/json\" \
          -H \"User-Agent: GitHub-Hookshot/antigravity\" \
          -H \"X-GitHub-Event: workflow_run\" \
          -H \"X-GitHub-Delivery: $DELIVERY_ID\" \
          -H \"X-Hub-Signature-256: $SIGNATURE\" \
          -d '$PAYLOAD'"

        HTTP_RESPONSE=$(sh -c "curl -s -w '\n%{http_code}' $CURL_ARGS")
        HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
        HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1)

        echo "HTTP Status Code: $HTTP_STATUS"
        echo "Response Body:"
        echo "$HTTP_BODY"

        if [ "$HTTP_STATUS" -ge 400 ]; then
          exit 1
        fi

    - name: Send success notification
      if: ${{ success() }}
      uses: appleboy/telegram-action@v1
      with:
        to: ${{ inputs.telegram_to }}
        token: ${{ inputs.telegram_token }}
        message: Build success "${{ inputs.commit_message }}"

    - name: Send failure notification
      if: ${{ failure() }}
      uses: appleboy/telegram-action@v1
      with:
        to: ${{ inputs.telegram_to }}
        token: ${{ inputs.telegram_token }}
        message: Build failed "${{ inputs.commit_message }}"